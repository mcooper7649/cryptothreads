# Self-hosted CryptoThreads: app + Postgres. Secrets live in .env (see .env.example).
# Start with:  docker compose up -d --build
name: cryptothreads
services:
  db:
    image: postgres:16-alpine
    container_name: cryptothreads-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryptothreads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cryptothreads
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptothreads"]
      interval: 5s
      retries: 10
    mem_limit: 512m

  app:
    build: .
    image: cryptothreads/app
    container_name: cryptothreads-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cryptothreads:${POSTGRES_PASSWORD}@db:5432/cryptothreads
      STORAGE_DIR: /data/cache
    ports: ["${APP_PORT:-8040}:3000"]
    volumes: ["assets:/data/cache"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 1g

volumes:
  db:
  assets:
